name: Monthly items (referential) sync

# Référentiel API TCG (apitcg.com) : peuple/maj `items` (noms, sets,
# release_date, images, rareté) pour Pokémon + One Piece -- la SEULE source
# qui crée de nouveaux items EN (PriceCharting matche sur `items` existant
# via nom/numéro, ne le peuple pas ; cf. ingestion/orchestrator.py).
#
# Retiré du run quotidien le 2026-08-10 : quota mensuel (1000 req) épuisé en
# quelques jours malgré le mode incrémental (`updatedSince`, cf. mémoire
# projet "apitcg_quota"), pour un bénéfice quotidien quasi nul -- Pokémon/One
# Piece ne sortent pas un nouveau set chaque jour. Cadence mensuelle
# largement suffisante pour capter les nouvelles sorties (prix/gradation/
# ventes des cartes déjà connues n'en dépendent pas, cf. daily-sync.yml/
# tiered-sync.yml). Rattrapable à la main entre deux runs via
# `python -m ingestion.orchestrator --items-only` si un nouveau set sort et
# qu'on ne veut pas attendre.
#
# Le 3 (pas le 1er, pour éviter la ruée du jour calendaire pile comme les
# autres crons du repo) à 02:00 UTC -- horaire non contraint par la
# contention CockroachDB des autres workflows (référentiel seul, pas de
# calcul d'index derrière, cf. run_items_sync) : pas besoin du même soin de
# décalage que daily-sync.yml/tiered-sync.yml.
on:
  schedule:
    - cron: "0 2 3 * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m ingestion.orchestrator --items-only
        env:
          APITCG_API_KEY: ${{ secrets.APITCG_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
