name: Rarity backfill sync

# Backfill `items.rarity` via LimitlessTCG (Pokémon EN+JP, One Piece + promos),
# cf. ingestion/sources/limitlesstcg.py et ingestion/orchestrator.py
# (run_rarity_backfill_sync). Scraping d'appoint tant que le quota API TCG ne
# fournit pas attributes.Rarity sur tout le catalogue (cf. mémoire projet
# "apitcg_quota_1000_incremental_sync" / "limitlesstcg_rarity_backfill").
# Idempotent (UPDATE) : chaque run récupère la rareté des nouveaux sets sortis
# depuis le dernier passage, sans quoi la couverture se fige comme le premier
# run manuel du 2026-08-02.
#
# Cadence hebdomadaire (pas quotidienne) : un nouveau set ne sort pas assez
# souvent pour justifier plus, même logique que ebay-listings-sync.yml. Créneau
# horaire non rond pour éviter la file d'attente GitHub Actions aux horaires
# pile (cf. les deux autres workflows).
on:
  schedule:
    - cron: "19 3 * * 5"  # vendredi, ~05:19 heure locale FR/SE (été)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m ingestion.orchestrator --rarity-backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
