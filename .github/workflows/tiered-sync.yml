name: Tiered grades & sales sync

# Gradation PSA7-10 + historique de ventes individuelles (eBay/TCGPlayer/...)
# via PriceCharting -- système de paliers par âge de set (cf.
# ingestion/orchestrator.py TIERS), pas une fenêtre fixe unique : plus un set
# est récent, plus il est vérifié souvent (c'est là que se joue le pouls du
# marché, et que le plafond ~30 ventes/palier PriceCharting risque de faire
# perdre des ventes si on espace trop). Un seul workflow, 5 déclencheurs cron
# -- chacun mappé à un palier via `github.event.schedule` (cf. étape
# "Détermine le palier" ci-dessous), remplace l'ancien grades-and-sales.yml
# (fenêtre fixe 18 mois, plus assez pour couvrir le catalogue complet).
#
# Palier vintage (36+ mois, ~77% du catalogue Pokémon à lui seul) trop gros
# pour un seul run même à sa propre fréquence : découpé en 8 tranches
# tournantes réparties sur les runs hebdomadaires -- couverture complète tous
# les ~2 mois (cf. ingestion/orchestrator.py::_current_vintage_slice).
#
# Palier "jp_singles" ajouté le 2026-08-01 : gradation + ventes des singles
# JP (Pokémon + One Piece), même mécanisme de rotation que vintage mais sans
# notion d'âge (pas de release_date côté JP) -- 12 tranches, couverture
# complète tous les ~3 mois. Volume comparable à tout le catalogue EN
# réparti sur un seul palier hebdomadaire, cf. ingestion/orchestrator.py TIERS.
#
# --skip-items partout ici : le référentiel API TCG a sa propre cadence
# mensuelle depuis 2026-08-10 (cf. .github/workflows/monthly-items-sync.yml),
# ni ce workflow ni daily-sync.yml n'en ont besoin -- il n'apporte que
# `items.release_date`/nouveaux sets, pas les prix/gradation/ventes des items
# déjà connus (PriceCharting).
#
# Horaires décalés le 2026-08-01 (cf. daily-sync.yml pour le contexte complet
# de l'incident) : tôt dans la nuit heure locale FR/SE (UTC+2 l'été) pour
# absorber le retard de scheduling GitHub Actions observé sur ce repo, et
# minutes non rondes pour éviter la file d'attente aux heures pile. Étalés de
# ~14-28 min les uns des autres (au lieu de tous à 03:00/04:00 UTC) pour ne
# pas faire démarrer plusieurs jobs de CE workflow pile en même temps. Jours
# de semaine inchangés (toujours en UTC, pas décalés au-delà de minuit
# local) : hot/recent/established/vintage restent respectivement quotidien/
# lun-mer-ven/dimanche/samedi ; jp_singles ajouté le mardi (seul jour encore
# libre).
#
# Re-décalés en bloc de +1h22 le 2026-08-10 (incident retries CockroachDB,
# cf. shared/db.py::retry_on_serialization_failure) : le premier créneau
# (hot, 01:43 UTC) démarrait seulement 26 min après daily-sync.yml
# (01:17 UTC), qui prend couramment 80-90 min -- les deux tournaient donc en
# même temps presque toutes les nuits et s'écrivaient dessus sur les mêmes
# tables de calcul (indices/undervalued/sealed_ev/volume/grading_roi_inputs,
# calculées par les deux workflows). Le retry côté Python absorbe déjà ce
# conflit s'il se reproduit (ex. après un run manuel décalé), mais autant ne
# pas y compter chaque nuit : hot démarre maintenant à 03:05 UTC, largement
# après le pire cas de daily-sync (90 min de timeout -> fin au plus tard
# 02:47 UTC).
on:
  schedule:
    - cron: "05 3 * * *"      # hot : quotidien, ~05:05 heure locale
    - cron: "33 3 * * 1,3,5"  # recent : lundi/mercredi/vendredi, ~05:33 heure locale
    - cron: "45 3 * * 0"      # established : dimanche, ~05:45 heure locale
    - cron: "59 3 * * 6"      # vintage : samedi, ~05:59 heure locale
    - cron: "13 4 * * 2"      # jp_singles : mardi, ~06:13 heure locale
  workflow_dispatch:
    inputs:
      tier:
        description: "Palier à synchroniser (déclenchement manuel uniquement)"
        required: true
        type: choice
        options: [hot, recent, established, vintage, jp_singles]
        default: hot

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Détermine le palier
        id: tier
        run: |
          if [ -n "${{ github.event.inputs.tier }}" ]; then
            echo "value=${{ github.event.inputs.tier }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "05 3 * * *") echo "value=hot" >> "$GITHUB_OUTPUT" ;;
              "33 3 * * 1,3,5") echo "value=recent" >> "$GITHUB_OUTPUT" ;;
              "45 3 * * 0") echo "value=established" >> "$GITHUB_OUTPUT" ;;
              "59 3 * * 6") echo "value=vintage" >> "$GITHUB_OUTPUT" ;;
              "13 4 * * 2") echo "value=jp_singles" >> "$GITHUB_OUTPUT" ;;
              *) echo "Palier inconnu pour le cron '${{ github.event.schedule }}'" >&2; exit 1 ;;
            esac
          fi

      - run: python -m ingestion.orchestrator --tier ${{ steps.tier.outputs.value }} --skip-items
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
