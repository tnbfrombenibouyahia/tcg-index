name: eBay active listings sync

# Comptage de listings actifs (auction + fixed-price) par item scellé, via
# eBay Browse API -- nouvelle dimension "supply"/pression vendeuse, cf.
# ingestion/sources/ebay.py et mémoire projet "ebay_active_listings". Scope
# v1 : Pokémon scellé + sets récents seulement (cf. run_ebay_listings_sync).
#
# Cadence hebdomadaire (pas quotidienne comme daily-sync.yml) : cette donnée
# bouge moins vite que le prix, et le jeudi est le seul jour encore libre
# dans le planning cron existant (cf. tiered-sync.yml : hot=quotidien,
# recent=lun/mer/ven, established=dim, vintage=sam, jp_singles=mar).
#
# Incident découvert le 2026-08-13 (question utilisateur "comment améliorer
# /liquidity" -> investigation a trouvé que `active_listings` n'avait pas
# bougé depuis le 07/08, alors que ce cron est censé tourner chaque semaine) :
# ce workflow tournait à `05 3 * * 4`, EXACTEMENT la même minute que le palier
# "hot" quotidien de tiered-sync.yml (`05 3 * * *`, donc actif tous les
# jeudis aussi) -- les deux se percutaient sur CockroachDB, ce workflow
# n'ayant ni retry ni `concurrency` group pour absorber le conflit (contraire
# à daily-sync.yml/tiered-sync.yml, qui ont déjà résolu exactement ce
# problème le 2026-08-12, cf. leurs commentaires). `sync_runs` confirme 3
# échecs `RETRY_SERIALIZABLE` le 2026-08-13 ~04:52-05:00 UTC, zéro ligne
# écrite. Fix : rejoint le même `concurrency` group partagé (queue plutôt que
# percute, quel que soit le retard de scheduling GitHub Actions ce jour-là --
# la leçon retenue par les deux autres workflows) + décalage d'1h de l'heure
# de départ (défense en profondeur, même mais pas suffisant seul d'après leur
# historique) + retry applicatif ajouté côté ebay.py (cf. son commentaire).
on:
  schedule:
    - cron: "05 4 * * 4"  # jeudi, ~06:05 heure locale FR/SE (été) -- 1h après le palier "hot" de tiered-sync.yml
  workflow_dispatch: {}

concurrency:
  group: pricecharting-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m ingestion.orchestrator --ebay-listings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
