name: Monthly population sync

# Population PSA+CGC réelle (comptage de cartes par grade, PAS un prix) via
# PriceCharting `/pop/set/{slug}` -- même hôte/infra que le reste de
# pricecharting.py, découverte utilisateur 2026-08-10 (psacard.com/pop
# lui-même est bloqué Cloudflare, cf. mémoire projet
# "psa_pop_report_blocked" ; PriceCharting republie la même donnée sans
# blocage). Cf. db/schema.sql::population_snapshots et
# ingestion/orchestrator.py::run_population_sync.
#
# 1 requête HTTP par set (pas par carte comme la gradation de PRIX,
# fetch_grades) -- tout le catalogue mappé (~226 sets, deux TCG) tient dans
# un seul run de quelques minutes, pas besoin du système de paliers TIERS.
#
# Cadence mensuelle : la page source elle-même annonce "population census
# updated monthly" -- scraper plus souvent ne rapporterait rien de neuf.
# Le 10 (pas le 3 comme monthly-items-sync.yml, pour éviter le même horaire
# calendaire) à 02:27 UTC -- minute non ronde, même prudence que les crons
# hebdomadaires (rarity-backfill-sync.yml, ebay-listings-sync.yml) pour
# éviter la file d'attente GitHub Actions aux horaires pile.
on:
  schedule:
    - cron: "27 2 10 * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m ingestion.orchestrator --population
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
