name: Daily sync

# Prix ungraded (PriceCharting) sur tous les sets mappés. Voir
# ingestion/orchestrator.py pour le détail des étapes.
#
# --skip-items depuis 2026-08-10 : le référentiel API TCG a sa propre cadence
# mensuelle désormais (quota 1000 req/mois épuisé en quelques jours en
# quotidien, cf. .github/workflows/monthly-items-sync.yml et mémoire projet
# "apitcg_quota") -- APITCG_API_KEY n'est donc plus nécessaire ici.
#
# 01:17 UTC (~03h17 heure d'été FR/SE, UTC+2) plutôt qu'une heure ronde comme
# avant (06:00 UTC) -- décidé le 2026-08-01 (le run du jour n'avait toujours
# pas démarré à 06:00+2h13, cf. incident). Deux effets recherchés : (1) tôt
# dans la nuit pour que même avec le retard GitHub Actions observé sur ce
# repo (~2h ce jour-là) tout soit fini avant un réveil ~10h ; (2) minute non
# ronde (:17) pour éviter la file d'attente sur les cron à l'heure pile, que
# GitHub recommande explicitement d'éviter (charge partagée entre tous les
# repos programmés à :00). Pas littéralement minuit local : minuit CEST =
# 22:00 UTC, ce qui aurait fait chevaucher le jour calendaire UTC précédent
# -- sans incidence ici (pas de contrainte de jour de semaine), gardé simple.
#
# Incident 2026-08-12 : malgré le décalage +1h22 du 08-10 (cf. tiered-sync.yml),
# retard de scheduling GitHub Actions ce soir-là (~1h45-2h11 sur les 3 crons de
# la nuit) -- Daily sync et Tiered `hot` ont quand même tourné en même temps
# (~1h18 de recouvrement avec `recent` en plus) et se sont marchés dessus sur
# les tables d'agrégats (indices/undervalued/sealed_ev/volume), `hot` a
# épuisé ses 10 retries CockroachDB et est sorti en erreur. Le calage horaire
# ne peut pas fiabiliser un scheduler qu'on ne contrôle pas -- ajout d'un
# `concurrency` group partagé avec tiered-sync.yml : la 2e run en conflit est
# mise en file (pas annulée) au lieu d'écrire en parallèle, quel que soit le
# retard du jour. Le compteur de timeout-minutes ne décompte que le temps
# d'exécution, pas l'attente en file (doc GitHub) -- sans risque de cascade.
on:
  schedule:
    - cron: "17 1 * * *"  # ~03:17 heure locale FR/SE (été)
  workflow_dispatch: {}

concurrency:
  group: pricecharting-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 90 -> 120 min le 2026-08-12 : le run du 08-12 (sans collision avant la
    # fin) a quand même dépassé les 90 min de peu (cancelled à 363/429 sets
    # JP singles) -- le catalogue JP a grossi au-delà des ~380 items prévus
    # au dimensionnement initial du 08-01. 120 min laisse de la marge pour la
    # croissance du catalogue + l'attente éventuelle en concurrency group.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m ingestion.orchestrator --skip-items
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
